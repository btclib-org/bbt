# The configuration of every tool that can be configured in one file,
# which is what replaced .flake8, .isort.cfg, mypy.ini, requirements.txt
# and requirements-dev.txt here.
#
# This tree is not a distribution. It is course material -- notebooks,
# spreadsheets, a regtest walk-through and a directory of scripts that
# demonstrate one thing each -- so nothing is built, installed, imported
# by anything, or published. `package = false` below is what says that to
# uv, and it is also why there is no `[build-system]`: measured, `uv sync`
# on a `[project]` with that key set and no build backend named creates
# the environment and installs the dependencies without asking for one.
#
# So section 3's metadata that only an index reads is not here -- no
# classifiers, no urls, no license expression -- there being no upload
# for any of them to describe, and README.md is what a reader of this
# repository is given instead.
#
# `keywords` is here all the same, and not as an exception to that
# reason: section 3 has the keywords be the GitHub topics, the same
# names in the same lowercase spelling, and the topics are how a reader
# of github.com/btclib-org finds course material. What the rule turns on
# is the repository and not the index, so a tree that uploads nothing
# owes the list all the same.

[project]
name = "bbt"
# a placeholder, and the reason is CONTRIBUTING.md's "A version, and no
# release": nothing here is released, so there is no version for a tag to
# agree with. Section 12's calendar versioning applies to what a release
# publishes
version = "0"
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
# there is no matrix here and no library covering the interpreters still
# in support: one person builds one environment to run a notebook or a
# script in. So the rule for an application applies -- the newest the
# dependencies allow -- and .python-version names it rather than this
# comment. Measured with `uv pip compile --python-version <v>` over the
# dependencies below: every version from 3.9 to 3.14 resolves, so the
# floor is not the dependencies' to set and nothing else here measures one
requires-python = ">=3.14"
# what the tree imports, read off the tree rather than off the file this
# replaces: `grep -rn "^import\|^from" py-scripts/*.py` and the `source`
# arrays of ipynb/*.ipynb are what the list below answers to.
#
# requirements.txt named `matplot`, which is a different project on PyPI
# from the `matplotlib` that py-scripts/hash_puzzle.py and
# ipynb/PartialHashInversion.ipynb import -- an environment built from
# that file had the plotting library it needed only by accident of
# jupyter pulling one in. It also left out `requests`, which
# py-scripts/getutxo.py imports
dependencies = [
    "btclib",
    # imported by nothing, and not a mistake: it is the kernel jupyter
    # starts a notebook in, so an environment without it opens ipynb/ and
    # cannot run a cell
    "ipykernel",
    "matplotlib",
    "pandas",
    "requests",
]
keywords = [
    # the GitHub topics, the same names in the same lowercase spelling.
    # The order is this file's alone -- `gh api repos/btclib-org/bbt
    # --jq '.topics'` sorts what it is given, so the two sequences are
    # compared by nothing -- and it runs from what the material is to
    # what the tree holds: ipynb/ the notebooks, calc/ and excel/ the
    # spreadsheets, regtest-lab/ the Bitcoin Core walk-through. Each
    # name is read against the tree rather than taken from a sibling's
    # list
    "bitcoin",
    "blockchain",
    "course-materials",
    "lecture-notes",
    "teaching",
    "cryptography",
    "elliptic-curves",
    "digital-signatures",
    "bitcoin-core",
    "regtest",
    "jupyter-notebook",
    "spreadsheet",
]

[dependency-groups]
# what requirements-dev.txt held, minus what uv makes unnecessary and
# what one tool replaced two of: `pip` and `wheel` are uv's business, and
# `black`, `flake8` and `isort` are ruff, which is the substitution every
# repository of the organization has already made. `pylint` is ruff's PL
# family, selected below.
#
# pre-commit is not here: the gate runs through `uvx`, for the reason
# CONTRIBUTING.md's last section gives, so a group naming it would be a
# declaration nothing reads
lint = ["mypy", "ruff"]
dev = [{ include-group = "lint" }]

[tool.uv]
# nothing is built here, so nothing installs this directory either
package = false
# the oldest uv that may read uv.lock, at the ceiling rather than safely
# below it -- section 1 has the argument and section 15 the command that
# re-derives the ceiling
required-version = ">=0.12.1"

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# the pair the organization holds every tree to: naming a rule in
# `ignore` instead of coding it is itself a preview feature, and
# explicit-preview-rules takes back the rest of preview, so a rule ruff
# is still designing runs only where this file names it exactly
preview = true
explicit-preview-rules = true
# every rule family ruff ships, present ones and a release's future ones
# alike, per section 5: a hand-picked list is a thing that rots, since
# nothing forces a second edit here the day ruff ships a family nobody
# has looked at yet. `ignore` below is where a family or a single rule
# is turned back off, each entry argued beside it -- a rule this tree
# declines on its own merits, since no formatter runs here for one to
# conflict with (this tree's own reason for E501 below). `uvx ruff
# check --preview --select ALL .` is what re-derives the delta, and
# `--statistics` the count by rule
select = ["ALL"]
ignore = [
    # a script's or a notebook cell's output is the whole of what it
    # produces, and .github/scripts/check_notebooks.py's own three
    # prints are the one line of its log worth reading when lint.yml
    # fails. `uvx ruff check --preview --select T201 .` lists every site,
    # and every one is py-scripts, ipynb or that one CI script
    "print",
    # assert used to state what a step shows, throughout py-scripts and
    # the notebooks alike -- a walkthrough asserting what it just
    # computed, not a library validating a caller's input
    "assert",
    # no file here is part of a package and none will become one: every
    # script is run on its own (py-scripts/README.md's
    # `uv run python py-scripts/<name>.py`), and .github/scripts/ is read
    # by path from a workflow rather than imported. `namespace-packages`
    # in `[tool.ruff]` above is the alternative, declaring a directory to
    # already carry an `__init__.py` it does not -- rejected because
    # nothing here is a namespace package either, so declaring one would
    # misstate the tree in the direction opposite this ignore's own
    "implicit-namespace-package",
    # what this finds is deliberately kept for the reader, not left over
    # from a refactor: an alternative computation commented out beside
    # the one that runs in ec_explorer.py and conversions.py, and
    # getutxo.py's own comment walking the shape of the JSON the API
    # returns, which happens to read as Python and is not
    "commented-out-code",
    # the crypto and Bitcoin notation exemption section 5 argues for
    # pep8-naming: `cG`, `x_K`, `y_K` and `sK` in dsa_example2.py name a
    # point, a coordinate and a scalar the way the DSA public-key
    # recovery they walk is written, and `wNAF_4`/`wNAF_5` in
    # speedup_curvemult.py are the windowed NAF the comment beside them
    # already names. `x_K`/`x_Q` as argument names in ssa_example2.py and
    # ipynb/SSA.ipynb are the same two coordinates read by
    # `challenge()`, BIP340's own notation for them
    "mixed-case-variable-in-global-scope",
    "invalid-argument-name",
    # FIX refuses a TODO, a FIXME, an XXX or a HACK wherever one opens a
    # comment; TD disciplines the same four markers' format instead and
    # is not even a superset of what FIX catches -- HACK draws no TD
    # diagnostic at all. A repository that finishes what it starts keeps
    # the refusal and leaves TD here, matching every other tree of the
    # organization; `grep -rn "TODO\|FIXME\|XXX\|HACK" py-scripts ipynb
    # .github/scripts` finds none of the four today
    "TD",
    # what every sibling gets from ruff-format, this tree gets from
    # nothing: that hook is not in .pre-commit-config.yaml, for the
    # reason written beside the ruff hooks there. So selecting this rule
    # would be asking a person to rewrap teaching code by hand rather
    # than asking a formatter to do it. `uvx ruff check --select E501 .`
    # is what says how much is owed
    "line-too-long", # E501
    # 127 is the byte a BIP32 index is masked against, and 600 and 36000
    # are ten minutes and ten hours in seconds: each the number a
    # specification assigns rather than one this code chose and could
    # have named. 2 and 3 are neither -- they are the two primes a
    # primality test settles before it divides by anything, which is
    # arithmetic and not a name anybody withheld.
    # `uvx ruff check --preview --select PLR2004 .` lists them, and puts
    # the last two in py-scripts/ec_explorer.py's isprime
    "magic-value-comparison", # PLR2004
]

[tool.ruff.lint.per-file-ignores]
# a table of over a hundred literal curves, each row one call to
# Curve(p, a, b, G, n, h, weierstrass_check): naming the last argument by
# keyword on every row would not make one row more legible, only every
# row longer, and the table's own columns already say what each position
# means
"py-scripts/ellipticcurves.py" = ["FBT003"]
# every notebook function walks a spec's own untyped pseudocode as the
# cell presents it -- DSA.ipynb, SSA.ipynb and field_table.ipynb's
# `tagged_hash`, `challenge` and `field_table` carry no annotation in the
# notebook that mypy never reads (pyproject.toml's own `[tool.mypy]`
# comment: the hook names py-scripts and .github/scripts, not ipynb).
# The typed py-scripts equivalent, where one exists, already carries full
# annotations -- ssa_example2.py's own `challenge(x_K: int, x_Q: int, ...)`
"ipynb/*.ipynb" = ["ANN001", "ANN201"]
# check_notebooks.py parses nbformat's own untyped JSON structures -- a
# cell, a document, a notebook `executed()` hands back -- and `Any` is
# what is honestly known about them, matching the loader argument section
# 5 already makes for a JSON loader's own return: the caller's contract
# to narrow, not the loader's to fake with a cast it cannot check
".github/scripts/check_notebooks.py" = ["ANN401"]

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT is the one place the notice text is written down; this is
# all three of its lines as one regex, and byte for byte the string
# btclib, btclib-secp256k1, btclib-benchmarks and btclib-node carry.
# Anchored with `^`, which section 5 asks for: unanchored, CPY001 is a
# search over the first 4096 bytes and not a check that the notice opens
# the file, and an `import` written above the notice passes it -- run
# against a file shaped that way, the same pattern without the `^`
# reports nothing.
#
# What the anchor cost here is the shebang the scripts opened with, no
# pattern anchored at byte zero being able to match a file that keeps
# one. Putting the notice above the shebang was measured and is worse
# than the finding: with no `#!` at byte zero the kernel hands the file
# to the shell, which reads the first `print(...)` as a syntax error. So
# the shebang went, and the executable bit that
# `check-shebang-scripts-are-executable` pairs with it, because what it
# declared was an interpreter that cannot run these scripts anyway --
# `#!/usr/bin/env python3` resolves off PATH and not to the environment
# `uv sync` builds, where btclib is (`python3 -c "import btclib"`), and
# py-scripts/README.md documents `uv run python py-scripts/<name>.py`,
# which consults no shebang.
#
# ipynb/PartialHashInversion.ipynb's first code cell opened with the
# same line and it went too, but for none of those reasons: a cell is
# not a file, nothing execs it, it has no executable bit, and
# check-shebang-scripts-are-executable never reads it. It was a comment,
# and what the anchor cost there was only that -- no pattern anchored at
# the start of the cell can match one that keeps it
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

[tool.ruff.lint.mccabe]
# ruff's default, and the number .flake8 already carried -- commented
# out, so nothing enforced it. The tree answers zero to it today, which
# is what makes turning it on a gate instead of a backlog
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# the 80 columns .flake8 asked for as `max-line-length`, kept where it
# still holds: the prose. Code width is E501's question and is ignored
# above; this is the comments and the docstrings, held to the width
# markdownlint holds the markdown to. W505 is inert without this key,
# ruff having no default doc length
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
# section 5's own convention, and what D needs to run without printing
# its two incompatible-pair warnings: D203 against D211 and D212 against
# D213 are each a pair ruff refuses to settle on its own, and pep257 is
# what settles both
convention = "pep257"

# typos' configuration, and the only spell checker configuration this
# file carries: codespell has nothing relaxed for it anywhere, so
# everything it is told is the arguments .pre-commit-config.yaml passes.
# Section 4 of the standard is what puts a spell checker's configuration
# in this file rather than in a dotfile of its own.
#
# What is *not* here matters as much: no `files.extend-exclude`. A file
# the checker never reads is a file nobody is checking, and this tree's
# vectors sit inside the scripts that demonstrate them rather than in a
# data directory that could be skipped whole -- so what is named is the
# token, and the next vector that trips the checker is an edit somebody
# has to make deliberately. .pre-commit-config.yaml does hold an exclude
# and it is not this one: what it keeps off the notebooks is the
# in-place fixing, a reporting entry beside each fixer reading them.
#
# Nor is `[default.extend-words]` here, and that is the same argument
# one step in. A word entry stops the checker reporting its token in
# every file of the tree, prose as readily as encoding, where what this
# tree has to protect is a fixed string in one script -- so a word entry
# buys the string and spends the word. Without the identifiers below,
# `typos --write-changes` rewrites a BIP32 test vector, turning
# `...SL39UNdE3BBDu76` into `...SL39UAndE3BBDu76` and `3ND1` into
# `3AND1` inside a base58 xprv and xpub: a base58 string is not a word
# and this checker cannot tell. codespell matches whole words and
# reports neither.

# matched whole, before the checker splits an identifier into words, so
# each key protects one string and leaves the fragment read inside it
# spell checked everywhere else in the tree
[tool.typos.default.extend-identifiers]
# the Colab cell id of one cell of DSA.ipynb and of the same cell in
# SSA.ipynb. The entry of .pre-commit-config.yaml that reads the
# notebooks and does not write them is what finds it there; the entry
# beside it that writes everything else finds it wherever the identifier
# is written out, which is .pre-commit-config.yaml's own comment and
# CHANGELOG.md's entry -- and CHANGELOG.md is append-only, so this stays
# owed even if that comment is one day reworded away
aecLiCr2dNIz = "aecLiCr2dNIz"
# BIP32's serialization function, named in the comment above
# `child_number` in bip32_testvector1.py and bip32_testvector3.py
ser32 = "ser32"
# the extended private key bip32_testvector1.py asserts against for
# m/0'/1/2'/2/1000000000
xprvA41z7zogVVwxVSgdKUHDy1SKmdb533PjDz7J6N6mV6uS3ze1ai8FHa8kmHScGpWmj4WggLyQjgPie1rFSruoUihUZREPSL39UNdE3BBDu76 = "xprvA41z7zogVVwxVSgdKUHDy1SKmdb533PjDz7J6N6mV6uS3ze1ai8FHa8kmHScGpWmj4WggLyQjgPie1rFSruoUihUZREPSL39UNdE3BBDu76"
# the master extended public key bip32_testvector3.py asserts against
xpub661MyMwAqRbcEZVB4dScxMAdx6d4nFc9nvyvH3v4gJL378CSRZiYmhRoP7mBy6gSPSCYk6SzXPTf3ND1cZAceL7SfJ1Z3GC8vBgp2epUt13 = "xpub661MyMwAqRbcEZVB4dScxMAdx6d4nFc9nvyvH3v4gJL378CSRZiYmhRoP7mBy6gSPSCYk6SzXPTf3ND1cZAceL7SfJ1Z3GC8vBgp2epUt13"
# the WIF prvkey2wif_compressed.py asserts against, which is the base58
# encoding of the private key printed above it
KwdMAjGmerYanjeui5SHS7JkmpZvVipYvB2LJGU1ZxJwYvP98617 = "KwdMAjGmerYanjeui5SHS7JkmpZvVipYvB2LJGU1ZxJwYvP98617"

# `CPY` is ruff's name for the copyright rule, selected above, and this
# checker offers `COPY` and `CPU` for it. No identifier entry narrows
# this one the way those above narrow theirs, the identifier being the
# word itself, so what is narrowed is the file instead: CHANGELOG.md is
# where the rule is named, that file is append-only, and `CPY` written
# anywhere else in this tree is still reported. Naming a type puts
# CHANGELOG.md in it rather than in `md`, and `typos --dump-config -`
# prints no `[type.md]` section for that to displace; whether a release
# of this checker later adds one is an argument and not a measurement.
# This file needs no entry at all, typos not reading the file its own
# configuration lives in: `typos --force-exclude --files .` lists what
# it does read
[tool.typos.type.changelog]
extend-glob = ["CHANGELOG.md"]

[tool.typos.type.changelog.extend-words]
CPY = "CPY"

[tool.mypy]
# mypy.ini's show_column_numbers, the one of its two settings that
# survives it, plus the strictness the organization asks for.
# show_error_codes is not the other: mypy 2.3.1, the version this
# tree's uv.lock pins, already reports a code on every error --
# `hide_error_codes` defaults to `False` -- so the key bought no check
# and btclib-org/.github#191 is why it is gone rather than carried
# forward.
#
# The `mypy` hook in .pre-commit-config.yaml is what runs this, and it
# names py-scripts and .github/scripts, which is where every tracked
# Python file of this tree is: `git ls-files '*.py'` is what says
# whether those two are still the whole of them. Where one line cannot
# be typed the answer is `# type: ignore[code]` at that line, and never
# a setting relaxed here
strict = true
warn_unreachable = true
show_column_numbers = true
python_version = "3.14"
# the optional error codes strict does not turn on: the list
# btclib-org/.github#165 decides for the organization, which is where it
# is written down until section 6 of the standard carries it. Of the
# codes it adds, `possibly-undefined` is the one that answered over
# `py-scripts/`: it refused hash_puzzle.py, where the report at the end
# of the script read two names only the loop above it bound. They are
# bound before the loop now, so nothing on the list reports today, which
# is what a ratchet is for -- the line written next is the one they are
# here to meet
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
