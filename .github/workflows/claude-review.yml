---
name: claude-review

# Claude reading a pull request against REVIEWING.md, and answering an
# @claude mention. The prompt, the credential guard, the action, the
# verdict check and the mention job are all btclib-org/.github's own:
# reusable-claude-review.yml, called at @main so a fix there reaches
# this tree in one landing (issue btclib-org/.github#35). What stays
# here is the trigger, the concurrency group, the workflow-level
# permissions:, and this header saying why this repository runs a
# review at all.
#
# What it is here for is the ack of record. Section 11 of the
# organization's standard says the author does not supply their own,
# and this repository has one maintainer -- so without this the only
# reading a pull request can get is the one its author wrote.
#
# What it produces is a review of type COMMENT, an opinion for the
# author to weigh. Not a required check, and it must not become one: a
# review that gated a merge would make a model's judgement a branch
# rule.
#
# One calling job, not two. The callee's own header says "a calling job
# reaches both jobs below" -- singular -- and that is a structural fact
# about a `uses:` call, not a stylistic choice: a `uses:` invokes the
# whole of the called workflow, every job in it, each governed by its
# own `if:`. Two calling jobs each doing `uses:` of the same file would
# each invoke both of the callee's jobs, so on a pull_request event both
# invocations would satisfy the callee's own `review` job condition and
# a review would post twice. The same sentence is why this job carries
# no `if:` of its own: the callee's `review` job answers a pull_request
# and its `mention` job answers a comment carrying @claude, and an `if:`
# here gating on the first would keep the second from ever starting.
#
# One job carries both the review and the @claude answer, so one
# concurrency key has to serve both without letting either land in the
# other's group. `github.event.pull_request.number` alone is not that
# key: a pull_request_review_comment event carries it too, so a mention
# answer would land in the review's own group and either could cancel
# the other; and an issue_comment event leaves it unset, so every
# mention in the repository would fall into the one group
# `claude-review-`, each cancelling the last. The key below is
# `btclib-org/btclib-secp256k1#593`'s: a `pull_request` event keys on
# the pull request's number, so a push supersedes the review it
# overtakes, and every other event keys on `github.run_id`, which no
# two runs share, so `cancel-in-progress` is inert for a mention and
# one @claude answer runs beside another rather than replacing it.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition inside the callee withheld while it was a draft:
    # the default types do not include it, and without it a readied
    # pull request would wait for its next push to be reviewed at all.
    # closed too: the group below is at the workflow level, so a closed
    # run enters it when the run is created, before any job's own `if:`
    # is read, and can cancel a review still holding the group -- what
    # declines the actual review on a closed pull request is the
    # callee's own job-level `if:`, not this trigger
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the
  # automatic pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN at the workflow level, elevated
# on the calling job below
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere
# else here; see the header above for what this key keeps apart and why
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    with:
      # this tree's own paragraph, landing between the callee's verdict
      # paragraph and its instruction not to run the gates -- the one
      # insertion point extra-prompt has
      extra-prompt: |
        What this repository ships is course material -- pages,
        notebooks with their outputs committed, spreadsheets and
        scripts -- and nothing runs a page or a spreadsheet.
        lint.yml executes the transcript notebooks beside you and
        compares every output, and runs each script it does not
        exclude for its exit code alone, reading nothing the script
        prints. CLAUDE.md says what a change to each is verified by,
        and a review that reasons about what a script would do says
        so in those words rather than reporting a trace as a run.
    # named rather than `secrets: inherit`: inherit hands the callee
    # every secret this repository can see, and zizmor's
    # secrets-inherit audit fails on that, one finding per calling job
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      # restated, a job's permissions replacing the workflow's
      contents: read
      # what posting the review or the mention reply takes
      pull-requests: write # posting the review, and the reply to a mention
      # not for workload identity federation, which this does not use:
      # the action mints a GitHub OIDC token during its own startup.
      # Measured by leaving it out -- the run died before reaching
      # authentication at all, with "Could not fetch an OIDC token. Did
      # you remember to add `id-token: write` to your workflow
      # permissions?"
      id-token: write # the OIDC token the action mints at its own startup
