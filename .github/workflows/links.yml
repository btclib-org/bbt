---
name: links

# what this checks is an address, which is the defect a tree of prose can
# have without anybody touching it: the launcher links in
# regtest-lab/windows.md answered 404 for as long as it took somebody to
# read them, and nothing here said so.
#
# Not a gate, and that is the design rather than an omission. A link rots
# on somebody else's schedule, so testing it per commit reports the
# internet's weather on a branch that changed no link; and a host
# answering 502 or throttling a runner would turn a red merge into a run
# to repeat rather than a thing to fix. Weekly, on demand, and red in the
# Actions tab is where this belongs, so it is not in main's required
# checks and must not be: `Lint` is that check, and REPOSITORY.md's
# *Required checks on main* is where it is written down.

on:
  schedule:
    # the day and the hour are the `links` row of section 10's grid in
    # https://github.com/btclib-org/.github, the minute is this
    # repository's row of the table beside it, and neither is this
    # file's to choose or to restate
    - cron: "32 4 * * 6"
  # the escape hatch, and how a branch asks before a documentation change
  # that adds links is merged
  workflow_dispatch:
  # so a change to this file, or to the ignore list beside it, is checked
  # by the thing it configures
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml
      - .lycheeignore

# least privilege for the GITHUB_TOKEN, as in lint.yml: nothing here
# writes, and the token is supplied to the step below for github.com
# links alone, where an unauthenticated runner is rate limited hard
# enough to look like rot
permissions:
  contents: read

concurrency:
  # keyed on the pull request's number rather than on github.head_ref,
  # for the reason lint.yml's own group gives. A run with no pull request
  # falls back to github.ref
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the job itself is btclib-org/.github's, called at @main so a fix there
  # reaches this tree in one landing (section 10 of its README.md); what
  # stays here is the trigger, the schedule and which files are this
  # tree's documentation
  links:
    uses: btclib-org/.github/.github/workflows/reusable-links.yml@main
    with:
      targets: '"**/*.md" ".github/**/*.md" ".claude/**/*.md"'
